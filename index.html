<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>maps // klinekraft</title>
<link href="https://api.mapbox.com/mapbox-gl-js/v3.7.0/mapbox-gl.css" rel="stylesheet" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
  /* ============================================================
     KLINEKRAFT // CARTO  v2.0
     Slim. Four styles. No knobs. Just a frame and a button.
     ============================================================ */
  :root {
    --black:        #000000;
    --white:        #FFFFFF;
    --muted:        #F5F5F5;
    --muted-fg:     #525252;
    --border-light: #E5E5E5;
  }

  *, *::before, *::after { box-sizing: border-box; }

  html, body {
    margin: 0; padding: 0;
    height: 100%;
    overflow: hidden;
    background: var(--white);
    color: var(--black);
    font-family: "Inter", -apple-system, BlinkMacSystemFont, sans-serif;
    font-size: 15px;
    line-height: 1.5;
    font-feature-settings: "kern" 1, "liga" 1, "ss01" 1, "cv11" 1;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }

  /* Subtle horizontal-line texture for printed-paper feel */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 1;
    background-image: repeating-linear-gradient(
      0deg, transparent, transparent 1px,
      var(--black) 1px, var(--black) 2px
    );
    background-size: 100% 4px;
    opacity: 0.012;
  }

  button, input { font-family: inherit; color: inherit; }
  button { cursor: pointer; }

  /* ============================================================
     LAYOUT
     ============================================================ */
  .sidebar {
    position: fixed;
    top: 0; left: 0; bottom: 0;
    width: 360px;
    background: var(--white);
    border-right: 2px solid var(--black);
    overflow-y: auto;
    padding: 40px 32px 24px;
    z-index: 10;
  }
  .sidebar::-webkit-scrollbar { width: 0; }

  .map-container {
    position: fixed;
    top: 0; left: 360px; right: 0; bottom: 0;
    background: var(--muted);
  }
  #map { position: absolute; inset: 0; }

  /* ============================================================
     HEADER
     ============================================================ */
  .sidebar-header {
    border-bottom: 4px solid var(--black);
    padding-bottom: 24px;
    margin-bottom: 32px;
  }
  .brand-line {
    font-family: "JetBrains Mono", ui-monospace, monospace;
    font-size: 10px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--black);
    margin-bottom: 16px;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .brand-line::after {
    content: '';
    flex: 1;
    height: 1px;
    background: var(--black);
  }
  h1 {
    font-family: "Inter", sans-serif;
    font-weight: 900;
    font-size: 44px;
    line-height: 1.0;
    letter-spacing: -0.035em;
    margin: 0 0 14px 0;
    color: var(--black);
  }
  .subtitle {
    font-family: "JetBrains Mono", ui-monospace, monospace;
    font-size: 10px;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--muted-fg);
  }

  /* ============================================================
     SECTIONS
     ============================================================ */
  .section {
    margin-bottom: 32px;
    padding-bottom: 32px;
    border-bottom: 1px solid var(--border-light);
  }
  .section:last-child { border-bottom: none; padding-bottom: 0; }
  .section-label {
    font-family: "JetBrains Mono", ui-monospace, monospace;
    font-size: 10px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--black);
    margin-bottom: 16px;
    font-weight: 600;
  }

  /* ============================================================
     STYLE BUTTONS — single rectangle stack
     ============================================================ */
  .style-list { display: flex; flex-direction: column; }
  .style-list .style-btn + .style-btn { margin-top: -1px; }
  .style-btn {
    display: flex;
    align-items: center;
    justify-content: space-between;
    width: 100%;
    padding: 14px 16px;
    background: var(--white);
    color: var(--black);
    border: 1px solid var(--black);
    border-radius: 0;
    font-family: "Inter", sans-serif;
    font-size: 14px;
    font-weight: 500;
    line-height: 1.2;
    text-align: left;
    transition: background 100ms, color 100ms;
    position: relative;
    letter-spacing: -0.005em;
  }
  .style-btn:hover:not(.active) {
    background: var(--black);
    color: var(--white);
  }
  .style-btn.active {
    background: var(--black);
    color: var(--white);
  }
  .style-btn .meta {
    font-family: "JetBrains Mono", ui-monospace, monospace;
    font-size: 9px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    opacity: 0.6;
    font-weight: 400;
  }
  .style-btn:focus-visible {
    outline: 3px solid var(--black);
    outline-offset: 3px;
    z-index: 2;
  }

  /* ============================================================
     SEGMENTED CONTROL (Portrait/Landscape)
     ============================================================ */
  .segmented {
    display: flex;
    border: 1px solid var(--black);
  }
  .segmented button {
    flex: 1;
    padding: 10px 8px;
    background: var(--white);
    color: var(--black);
    border: none;
    border-right: 1px solid var(--black);
    border-radius: 0;
    font-family: "JetBrains Mono", ui-monospace, monospace;
    font-size: 10px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    transition: background 100ms, color 100ms;
    font-weight: 500;
  }
  .segmented button:last-child { border-right: none; }
  .segmented button:hover:not(.active) {
    background: var(--black);
    color: var(--white);
  }
  .segmented button.active {
    background: var(--black);
    color: var(--white);
  }
  .segmented button:focus-visible {
    outline: 3px solid var(--black);
    outline-offset: 3px;
    position: relative;
    z-index: 2;
  }

  /* ============================================================
     PAGE SIZE GRID
     ============================================================ */
  .size-grid {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    margin-bottom: 12px;
    border: 1px solid var(--black);
  }
  .size-btn {
    padding: 14px 10px;
    background: var(--white);
    color: var(--black);
    border: none;
    border-right: 1px solid var(--black);
    border-radius: 0;
    text-align: center;
    transition: background 100ms, color 100ms;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 5px;
    font-family: "Inter", sans-serif;
  }
  .size-btn:last-child { border-right: none; }
  .size-btn .name {
    font-size: 15px;
    font-weight: 700;
    line-height: 1;
    letter-spacing: -0.015em;
  }
  .size-btn .dim {
    font-family: "JetBrains Mono", ui-monospace, monospace;
    font-size: 9px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    opacity: 0.6;
    font-weight: 500;
  }
  .size-btn:hover:not(.active) {
    background: var(--black);
    color: var(--white);
  }
  .size-btn.active {
    background: var(--black);
    color: var(--white);
  }
  .size-btn:focus-visible {
    outline: 3px solid var(--black);
    outline-offset: 3px;
    position: relative;
    z-index: 2;
  }

  /* ============================================================
     INFO CARD
     ============================================================ */
  .info-card {
    border: 1px solid var(--black);
    padding: 14px 16px;
  }
  .info-row {
    display: flex;
    justify-content: space-between;
    padding: 6px 0;
    border-bottom: 1px solid var(--border-light);
  }
  .info-row:last-child { border-bottom: none; }
  .info-label {
    font-family: "JetBrains Mono", ui-monospace, monospace;
    font-size: 10px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--muted-fg);
    font-weight: 500;
  }
  .info-value {
    font-family: "JetBrains Mono", ui-monospace, monospace;
    font-size: 12px;
    color: var(--black);
    font-weight: 600;
  }

  /* ============================================================
     DOWNLOAD
     ============================================================ */
  .download-section {
    margin-top: 32px;
    padding-top: 24px;
    border-top: 4px solid var(--black);
  }
  .download-btn {
    display: flex;
    align-items: center;
    justify-content: space-between;
    width: 100%;
    padding: 18px 22px;
    background: var(--black);
    color: var(--white);
    border: 2px solid var(--black);
    border-radius: 0;
    font-family: "Inter", sans-serif;
    font-size: 13px;
    letter-spacing: 0.04em;
    font-weight: 600;
    transition: background 100ms, color 100ms;
  }
  .download-btn .arrow {
    font-family: "JetBrains Mono", ui-monospace, monospace;
    font-size: 16px;
    font-weight: 600;
  }
  .download-btn:hover:not(:disabled) {
    background: var(--white);
    color: var(--black);
  }
  .download-btn:disabled {
    opacity: 0.4;
    cursor: not-allowed;
  }
  .download-status {
    margin-top: 14px;
    font-family: "JetBrains Mono", ui-monospace, monospace;
    font-size: 10px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--muted-fg);
    text-align: center;
    font-weight: 500;
  }
  .download-status.success { color: var(--black); font-weight: 600; }
  .download-status.error   { color: var(--black); font-weight: 600; }

  /* ============================================================
     PAGE FRAME OVERLAY (the only thing on the map)
     ============================================================ */
  .page-overlay {
    position: absolute;
    inset: 0;
    pointer-events: none;
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 5;
  }
  .page-frame {
    border: 2px solid var(--black);
    background: rgba(255, 255, 255, 0.06);
    box-shadow: 0 0 0 2000px rgba(0, 0, 0, 0.18);
    position: relative;
  }
  .page-corner {
    position: absolute;
    width: 16px;
    height: 16px;
    border: 2px solid var(--black);
  }
  .page-corner.tl { top: -2px;    left: -2px;    border-right: none;  border-bottom: none; background: var(--white); }
  .page-corner.tr { top: -2px;    right: -2px;   border-left: none;   border-bottom: none; background: var(--white); }
  .page-corner.bl { bottom: -2px; left: -2px;    border-right: none;  border-top: none;    background: var(--white); }
  .page-corner.br { bottom: -2px; right: -2px;   border-left: none;   border-top: none;    background: var(--white); }
  .page-label {
    position: absolute;
    top: -36px;
    left: 50%;
    transform: translateX(-50%);
    background: var(--white);
    color: var(--black);
    padding: 6px 14px;
    border: 2px solid var(--black);
    font-family: "JetBrains Mono", ui-monospace, monospace;
    font-size: 10px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    font-weight: 600;
    white-space: nowrap;
  }

  /* ============================================================
     LOADING OVERLAY
     ============================================================ */
  .loading-overlay {
    position: absolute;
    inset: 0;
    background: rgba(255, 255, 255, 0.95);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 100;
  }
  .loading-overlay.visible { display: flex; }
  .loading-content {
    text-align: center;
    border: 2px solid var(--black);
    padding: 40px 60px;
    background: var(--white);
  }
  .loading-spinner {
    width: 32px;
    height: 32px;
    border: 2px solid var(--border-light);
    border-top-color: var(--black);
    margin: 0 auto 24px;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .loading-text {
    font-family: "Inter", sans-serif;
    font-size: 22px;
    font-weight: 700;
    letter-spacing: -0.02em;
    color: var(--black);
    margin-bottom: 8px;
  }
  .loading-detail {
    font-family: "JetBrains Mono", ui-monospace, monospace;
    font-size: 10px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--muted-fg);
    font-weight: 500;
  }

  /* ============================================================
     MAPBOX OVERRIDES
     ============================================================ */
  .mapboxgl-ctrl-group {
    border: 2px solid var(--black) !important;
    border-radius: 0 !important;
    box-shadow: none !important;
    background: var(--white) !important;
  }
  .mapboxgl-ctrl-group button {
    width: 36px !important;
    height: 36px !important;
    border-radius: 0 !important;
    background-color: var(--white) !important;
    border-bottom: 1px solid var(--black) !important;
  }
  .mapboxgl-ctrl-group button:last-child { border-bottom: none !important; }
  .mapboxgl-ctrl-group button:hover { background-color: var(--black) !important; }
  .mapboxgl-ctrl-group button:hover .mapboxgl-ctrl-icon { filter: invert(1); }
  .mapboxgl-ctrl-attrib {
    background: var(--white) !important;
    border: 1px solid var(--black);
    border-radius: 0 !important;
    font-family: "JetBrains Mono", ui-monospace, monospace !important;
    font-size: 9px !important;
    letter-spacing: 0.05em;
    text-transform: uppercase;
  }
  .mapboxgl-ctrl-attrib a { color: var(--black) !important; }

  /* ============================================================
     RESPONSIVE
     ============================================================ */
  @media (max-width: 900px) {
    .sidebar { width: 100%; height: 50%; bottom: 50%; border-right: none; border-bottom: 2px solid var(--black); }
    .map-container { left: 0; top: 50%; }
    h1 { font-size: 32px; }
  }
</style>
</head>
<body>

<aside class="sidebar">
  <div class="sidebar-header">
    <div class="brand-line">klinekraft // carto</div>
    <h1>Wall Map<br>Generator</h1>
    <div class="subtitle">v2.0 — print-ready</div>
  </div>

  <!-- MAP STYLE -->
  <div class="section">
    <div class="section-label">Map Style</div>
    <div class="style-list">
      <button class="style-btn active" data-style="light">
        <span>Light</span>
        <span class="meta">vector</span>
      </button>
      <button class="style-btn" data-style="dark">
        <span>Dark Blue</span>
        <span class="meta">vector</span>
      </button>
      <button class="style-btn" data-style="streets">
        <span>Streets</span>
        <span class="meta">vector</span>
      </button>
      <button class="style-btn" data-style="satellite">
        <span>Satellite</span>
        <span class="meta">raster</span>
      </button>
    </div>
  </div>

  <!-- PAGE SIZE -->
  <div class="section">
    <div class="section-label">Page Size</div>
    <div class="size-grid">
      <button class="size-btn active" data-size="letter"  data-w="8.5" data-h="11">
        <span class="name">Letter</span>
        <span class="dim">8.5 × 11</span>
      </button>
      <button class="size-btn" data-size="tabloid" data-w="11" data-h="17">
        <span class="name">Tabloid</span>
        <span class="dim">11 × 17</span>
      </button>
      <button class="size-btn" data-size="poster"  data-w="16" data-h="20">
        <span class="name">Poster</span>
        <span class="dim">16 × 20</span>
      </button>
    </div>

    <div class="segmented" id="orient-row">
      <button class="active" data-orient="portrait">Portrait</button>
      <button data-orient="landscape">Landscape</button>
    </div>
  </div>

  <!-- INFO -->
  <div class="section">
    <div class="section-label">Map Info</div>
    <div class="info-card">
      <div class="info-row">
        <span class="info-label">Center</span>
        <span class="info-value" id="info-center">—</span>
      </div>
      <div class="info-row">
        <span class="info-label">Zoom</span>
        <span class="info-value" id="info-zoom">—</span>
      </div>
      <div class="info-row">
        <span class="info-label">Scale</span>
        <span class="info-value" id="info-scale">—</span>
      </div>
    </div>
  </div>

  <!-- DOWNLOAD -->
  <div class="download-section">
    <button class="download-btn" id="download-btn">
      <span>Generate PDF</span>
      <span class="arrow">→</span>
    </button>
    <div class="download-status" id="download-status">Ready</div>
  </div>
</aside>

<main class="map-container" id="map-container">
  <div id="map"></div>

  <div class="page-overlay">
    <div class="page-frame" id="page-frame">
      <div class="page-corner tl"></div>
      <div class="page-corner tr"></div>
      <div class="page-corner bl"></div>
      <div class="page-corner br"></div>
      <div class="page-label" id="page-label">8.5 × 11 PORTRAIT</div>
    </div>
  </div>

  <div class="loading-overlay" id="loading-overlay">
    <div class="loading-content">
      <div class="loading-spinner"></div>
      <div class="loading-text">Generating Map</div>
      <div class="loading-detail" id="loading-detail">Stitching tiles…</div>
    </div>
  </div>
</main>

<script src="https://api.mapbox.com/mapbox-gl-js/v3.7.0/mapbox-gl.js"></script>
<script>
// ============================================================
// STATE
// ============================================================
const state = {
  pageSize:   'letter',
  pageW:      8.5,
  pageH:      11,
  orientation:'portrait',
  styleId:    'light',
  map:        null,
};

const STYLE_MAPBOX_PATHS = {
  'light':     'mapbox/light-v11',
  'dark':      'mapbox/dark-v11',
  'streets':   'mapbox/streets-v12',
  'satellite': 'mapbox/satellite-streets-v12',
};

// ============================================================
// API KEY LOADING
// ============================================================
async function loadApiKeys() {
  try {
    const r = await fetch('/api/map-token');
    if (r.ok) {
      const d = await r.json();
      if (d && d.token) mapboxgl.accessToken = d.token;
    }
  } catch (e) { console.warn('[token] fetch failed', e); }
}

// ============================================================
// PAGE FRAME
// ============================================================
function currentPageDims() {
  return state.orientation === 'portrait'
    ? { w: state.pageW, h: state.pageH }
    : { w: state.pageH, h: state.pageW };
}

function updatePageFrame() {
  const cont  = document.getElementById('map-container');
  const frame = document.getElementById('page-frame');
  const lbl   = document.getElementById('page-label');
  if (!cont || !frame) return;

  const cw = cont.clientWidth;
  const ch = cont.clientHeight;
  const margin = 60;
  const aw = cw - margin * 2;
  const ah = ch - margin * 2 - 40;
  const d = currentPageDims();
  const aspect = d.w / d.h;

  let fw, fh;
  if (aw / aspect <= ah) { fw = aw; fh = aw / aspect; }
  else                   { fh = ah; fw = ah * aspect; }

  frame.style.width  = fw + 'px';
  frame.style.height = fh + 'px';
  lbl.textContent = `${d.w} × ${d.h} ${state.orientation.toUpperCase()}`;
}

function updateInfo() {
  if (!state.map) return;
  const c = state.map.getCenter();
  const z = state.map.getZoom();
  document.getElementById('info-center').textContent = `${c.lat.toFixed(4)}, ${c.lng.toFixed(4)}`;
  document.getElementById('info-zoom').textContent   = z.toFixed(2);

  const metersPerPx  = (40075016.686 * Math.cos(c.lat * Math.PI / 180)) / Math.pow(2, z + 8);
  const milesPerInch = (metersPerPx * 96) / 1609.344;
  const denom        = Math.round(milesPerInch * 63360);
  document.getElementById('info-scale').textContent  = `1:${denom.toLocaleString()}`;
}

// ============================================================
// MAP INIT
// ============================================================
async function initMap() {
  state.map = new mapboxgl.Map({
    container: 'map',
    style: `mapbox://styles/${STYLE_MAPBOX_PATHS[state.styleId]}`,
    center: [-95.9928, 36.1539],
    zoom: 9,
    attributionControl: { compact: true }
  });
  state.map.addControl(new mapboxgl.NavigationControl({ showCompass: false }), 'top-right');

  state.map.on('load', () => {
    updatePageFrame();
    updateInfo();
  });
  state.map.on('move', updateInfo);
}

// ============================================================
// PDF GENERATION
// ============================================================
async function generatePdf() {
  const btn     = document.getElementById('download-btn');
  const stat    = document.getElementById('download-status');
  const overlay = document.getElementById('loading-overlay');
  const detail  = document.getElementById('loading-detail');

  btn.disabled = true;
  stat.textContent = 'Generating…';
  stat.className   = 'download-status';
  overlay.classList.add('visible');

  try {
    const d        = currentPageDims();
    const frameEl  = document.getElementById('page-frame');
    const fw       = frameEl.clientWidth;
    const fh       = frameEl.clientHeight;

    // Geographic bounds of the framed rectangle, computed by unprojecting
    // the four screen-pixel corners through mapbox-gl's current projection.
    // This is THE source of truth for what will be in the PDF — the same
    // mapbox-gl projection state that's drawing the map right now.
    const containerRect = state.map.getContainer().getBoundingClientRect();
    const frameRect     = frameEl.getBoundingClientRect();
    const localX        = frameRect.left - containerRect.left;
    const localY        = frameRect.top  - containerRect.top;

    const sw     = state.map.unproject([localX,      localY + fh]);
    const ne     = state.map.unproject([localX + fw, localY     ]);
    const center = state.map.unproject([localX + fw/2, localY + fh/2]);
    const zoom   = state.map.getZoom();

    const body = {
      bounds: {
        west:  sw.lng,
        south: sw.lat,
        east:  ne.lng,
        north: ne.lat,
      },
      center: { lng: center.lng, lat: center.lat },
      zoom:   zoom,
      pageWidthIn:  d.w,
      pageHeightIn: d.h,
      styleId: state.styleId,
    };

    detail.textContent = 'Rendering map…';
    const r = await fetch('/api/generate-pdf', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body),
    });
    if (!r.ok) {
      const txt = await r.text();
      throw new Error(txt || ('HTTP ' + r.status));
    }

    detail.textContent = 'Saving PDF…';
    const blob = await r.blob();
    const url  = URL.createObjectURL(blob);
    const a    = document.createElement('a');
    a.href     = url;
    a.download = `wallmap-${state.styleId}-${state.pageSize}-${state.orientation}.pdf`;
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);

    stat.textContent = 'Done — saved';
    stat.className   = 'download-status success';
  } catch (e) {
    console.error(e);
    stat.textContent = 'Error — try again';
    stat.className   = 'download-status error';
  } finally {
    btn.disabled = false;
    overlay.classList.remove('visible');
  }
}

// ============================================================
// EVENT WIRING
// ============================================================
function wireEvents() {
  // Style buttons
  document.querySelectorAll('.style-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.style-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      state.styleId = btn.dataset.style;
      try { state.map.setStyle(`mapbox://styles/${STYLE_MAPBOX_PATHS[state.styleId]}`); }
      catch (e) { console.error('setStyle failed', e); }
    });
  });

  // Page size
  document.querySelectorAll('.size-btn').forEach(b => {
    b.addEventListener('click', () => {
      document.querySelectorAll('.size-btn').forEach(x => x.classList.remove('active'));
      b.classList.add('active');
      state.pageSize = b.dataset.size;
      state.pageW    = parseFloat(b.dataset.w);
      state.pageH    = parseFloat(b.dataset.h);
      updatePageFrame();
      updateInfo();
    });
  });

  // Orientation
  document.querySelectorAll('#orient-row button').forEach(b => {
    b.addEventListener('click', () => {
      document.querySelectorAll('#orient-row button').forEach(x => x.classList.remove('active'));
      b.classList.add('active');
      state.orientation = b.dataset.orient;
      updatePageFrame();
      updateInfo();
    });
  });

  // Download
  document.getElementById('download-btn').addEventListener('click', generatePdf);

  // Resize
  window.addEventListener('resize', () => {
    updatePageFrame();
    if (state.map) state.map.resize();
  });
}

// ============================================================
// BOOT
// ============================================================
(async function() {
  await loadApiKeys();
  await initMap();
  wireEvents();
  updatePageFrame();
})();
</script>
